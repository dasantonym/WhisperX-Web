[build-system]
# Declared explicitly: Ubuntu 22.04's system pip (22.0.2, patched by Debian)
# falls back to the legacy backend with the system setuptools (<61), which
# predates PEP 621 support and silently builds an empty UNKNOWN-0.0.0 package
# without this table — dropping the `whisperx-web` console script from the
# CUDA Docker image.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperx-web"
version = "0.1.0"
description = "OpenAI-compatible transcription web API wrapping WhisperX"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-2-Clause" }
dependencies = [
    # Compatible-release pin: images only change when this pin is bumped
    # deliberately. The scheduled canary Docker build (see
    # .github/workflows/docker.yml) tests the latest WhisperX release so a
    # bump is an informed decision, not a gamble.
    "whisperx~=3.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
whisperx-web = "whisperx_web.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["whisperx_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

